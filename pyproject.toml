[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rephraser"
version = "1.2.7"
description = "Program for generating Markov chain passphrases from a corpus or model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Travis Palmer" },
]
dependencies = [
    "markovify<=0.9.4",
    "orjson<=3.13.0",
]

[project.scripts]
rephraser = "rephraser:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

